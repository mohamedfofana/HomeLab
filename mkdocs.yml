site_name: Mohamed FOFANA | Portfolio
site_description: Portfolio professionnel et documentation technique d'infrastructure.
site_author: Mohamed FOFANA
site_url: https://mohamedfofana.github.io/Portfolio/

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
  features:
    - hide.navigation
    - hide.toc
    - content.code.copy

markdown_extensions:
  - attr_list
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.keys         
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 👨‍💻 Portfolio: index.md
