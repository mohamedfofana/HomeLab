site_name: Mohamed FOFANA | Portfolio ASR
site_description: Portfolio professionnel et documentation technique d'infrastructure.
site_author: Mohamed FOFANA
site_url: https://mohamedfofana.github.io/HomeLab/

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 👨‍💻 Portfolio: index.md
  - 🚀 Projet HomeLab:
      - 🌐 1. Network & pfSense: 01-pfsense.md
      - 🏢 2. Active Directory Core: 02-active-directory.md
      - ⚡ 3. Automation PowerShell: 03-powershell.md
      - ⚙️ 4. Sécurité & GPO: 04-gpo.md
      - 🐧 5. DMZ & Serveur Web: 05-dmz-linux.md
      - 💾 6. Sauvegarde System State: 06-sauvegarde.md
